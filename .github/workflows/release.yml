name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          zip -r rodic-${{ github.ref_name }}.zip v2 v3 README.md -x "*/__pycache__/*"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: rodic-${{ github.ref_name }}.zip
          generate_release_notes: true
